name: Validar Ejercicio Completo

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Chequear el código
        uses: actions/checkout@v2

      - name: Analizar descripción del PR
        id: parse_pr_description
        run: |
          PR_DESCRIPTION="${{ github.event.pull_request.body }}"
          if echo "$PR_DESCRIPTION" | grep -q '\- \[X\] Java'; then
            echo "language=java" >> $GITHUB_ENV
          elif echo "$PR_DESCRIPTION" | grep -q '\- \[X\] JS'; then
            echo "language=javascript" >> $GITHUB_ENV
          else
            echo "ERROR: No se especificó el lenguaje." >> errors.txt
          fi
          EXERCISES=$(echo "$PR_DESCRIPTION" | grep '\- \[X\] Ejercicio' | grep -o '[0-9]')
          if [ -z "$EXERCISES" ]; then
            echo "ERROR: No se seleccionaron ejercicios." >> errors.txt
          fi
          echo "exercises=$EXERCISES" >> $GITHUB_ENV

      - name: Validar general
        id: validate_general
        run: |
          python scripts/validate_general.py ./ ${{ env.language }} > general_errors.txt || true

      - name: Validar ejercicios seleccionados
        id: validate_exercises
        run: |
          for exercise in ${{ env.exercises }}; do
            python "scripts/validate_exercise_$exercise.py" ./ ${{ env.language }} >> exercise_errors.txt || true
          done

      - name: Procesar errores
        id: process_errors
        run: |
          # Combinar errores
          cat general_errors.txt exercise_errors.txt > all_errors.txt || true

          # Agregar comentario al PR si hay errores
    if [ -s all_errors.txt ]; then
      echo "Se encontraron errores en la validación. Publicando comentario..." 
      gh pr comment ${{ github.event.pull_request.number }} --body "$(cat all_errors.txt)" --repo ${{ github.repository }}
      echo "validation_status=failure" >> $GITHUB_ENV
    else
      echo "¡Validación exitosa!" 
      echo "validation_status=success" >> $GITHUB_ENV
    fi

      - name: Establecer estado del PR
        if: ${{ env.validation_status == 'failure' }}
        run: |
          echo "Estableciendo estado de validación como fallo..."
          gh pr review ${{ github.event.pull_request.number }} --request-changes --body "Errores encontrados. Por favor corrige antes de volver a enviar."

      - name: Aprobar PR
        if: ${{ env.validation_status == 'success' }}
        run: |
          echo "Aprobando PR..."
          gh pr review ${{ github.event.pull_request.number }} --approve
